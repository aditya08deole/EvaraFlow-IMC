# Copy this to secret.yaml (gitignored -- never commit real values) and
# fill in your own real secrets, same ones as server/.env.example. Then:
#   kubectl apply -f k8s/secret.yaml
# before applying deployment.yaml, which reads these via envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: evaraflow-backend-secrets
type: Opaque
stringData:
  FIREBASE_SERVICE_ACCOUNT_BASE64: ""
  FIREBASE_STORAGE_BUCKET: ""
  EMQX_WEBHOOK_SECRET: ""
  DRIVE_WEBHOOK_SECRET: ""
  TAILSCALE_WEBHOOK_SECRET: ""
  TAILSCALE_IMAGE_BASE_URL: ""
  PUBLIC_BASE_URL: "http://localhost:30081"
  MQTT_HOST: "mqtt.evaratech.com"
  MQTT_PROTOCOL: "wss"
  MQTT_WS_PATH: "/mqtt"
  MQTT_USERNAME: ""
  MQTT_PASSWORD: ""
  MQTT_TOPIC_FILTER: "evaratech/v1/+/telemetry"
